[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 50
via_ir = true
ffi = false

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
hsk_mainnet = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"
